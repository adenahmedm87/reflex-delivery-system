<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reflex Rider</title><link rel="stylesheet" href="/css/styles.css"></head><body><header class="topbar"><div class="brand">REFLEX - Rider</div><button class="btn ghost" id="logout">Logout</button></header><main class="container"><div id="msg"></div><div class="grid three"><section class="card"><h3>Availability</h3><div class="actions"><button class="btn success" data-av="AVAILABLE">Available</button><button class="btn warn" data-av="BUSY">Busy</button><button class="btn secondary" data-av="OFFLINE">Offline</button></div></section><section class="card"><h3>Offline queue</h3><p><strong id="pending">0</strong> event(s) waiting.</p><button class="btn secondary" id="sync">Sync now</button></section><section class="card"><h3>GPS + ETA</h3><p id="gpsStatus" class="muted">GPS activates after Member 1 integration.</p></section></div><section class="card"><h2>Package pickup</h2><p class="muted">For local testing, enter the order number printed on the parcel QR. Camera scanning can be added later without changing the backend contract.</p><div class="actions"><input id="pickupCode" placeholder="ORD-..." style="max-width:300px"><button class="btn" id="pickupBtn">Confirm pickup code</button></div></section><h2>My deliveries</h2><div id="orders" class="grid two"></div></main><script src="/socket.io/socket.io.js"></script><script src="/js/rider.js"></script><script src="/js/gps.js"></script></body></html>
