<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reflex Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="login">
    <section class="card">
      <div class="brand">REFLEX</div>
      <h1>Delivery coordination that can recover.</h1>
      <p class="muted">Pentacore Group 33 MVP</p>
      <div id="msg"></div>
      <form id="form">
        <label>Email</label>
        <input id="email" type="email" required>
        <label>Password</label>
        <input id="password" type="password" required>
        <div class="actions">
          <button class="btn">Sign in</button>
          <a class="btn secondary" href="/track.html">Customer tracking</a>
        </div>
      </form>
      <hr>
      <p class="small">
        Demo: retailer@reflex.test / Retailer123! &nbsp; | &nbsp;
        dispatcher@reflex.test / Dispatcher123! &nbsp; | &nbsp;
        rider1@reflex.test / Rider123!
      </p>
    </section>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
